# .github/workflows/agentsmate-sync.yml
#
# The agent terminal is the AgentsMate package from focusedsystems/agentsmate,
# pinned in Package.swift to a commit on its main branch. AgentsMate is shared
# by several apps and FleetMate follows it one way. This workflow notices new
# AgentsMate commits, proves FleetMate still builds and passes its tests
# against them, and moves the pin. Nothing is ever sent back to AgentsMate.
#
# Upstream code runs only where no write access exists:
#   check   - read-only and runs nothing from AgentsMate. It compares the
#             pinned revision with AgentsMate's main head.
#   build   - read-only token, no persisted credentials. It builds and tests
#             against that head. Package plugins and build tools from upstream
#             run here too, and nothing produced here is trusted later.
#   publish - holds the write token and never builds or runs AgentsMate code.
#             It writes the head the check job saw into Package.swift itself,
#             opens or updates the PR, starts ci.yml on it and sets it to
#             merge once that passes.
#
# A pull request opened with GITHUB_TOKEN does not start pull_request
# workflows, but a workflow_dispatch does run. main requires ci.yml's check,
# so publish starts ci.yml on the branch and the pull request merges only
# when that run passes, the same gate as every other pull request.

name: agentsmate-sync

# Runs whenever FleetMate's main moves, so each new build starts from the
# latest AgentsMate, and by hand (workflow_dispatch) to pick one up sooner.
# AgentsMate changes rarely once it settles, so no timer. The pin bump this
# workflow merges is itself a push to main; that run finds the pin current
# and stops after the check.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: agentsmate-sync
  cancel-in-progress: false

permissions: {}

env:
  UPSTREAM: https://github.com/focusedsystems/agentsmate.git
  BRANCH: chore/agentsmate-sync

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      revision: ${{ steps.compare.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compare the pin with AgentsMate main
        id: compare
        run: |
          pinned=$(grep -oE 'agentsmate\.git", revision: "[0-9a-f]{40}"' Package.swift | grep -oE '[0-9a-f]{40}')
          latest=$(git ls-remote "$UPSTREAM" refs/heads/main | cut -f1)
          echo "pinned=$pinned latest=$latest"
          echo "$pinned" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::No AgentsMate revision pin in Package.swift"; exit 1; }
          echo "$latest" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::Could not read AgentsMate main"; exit 1; }
          echo "revision=$latest" >> "$GITHUB_OUTPUT"
          if [ "$pinned" = "$latest" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: macos-26
    permissions:
      contents: read
    env:
      REVISION: ${{ needs.check.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select newest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Move the pin to AgentsMate main
        run: |
          sed -i '' -E "s/(agentsmate\.git\", revision: \")[0-9a-f]{40}/\1$REVISION/" Package.swift
          grep -q "revision: \"$REVISION\"" Package.swift

      - name: Build
        run: |
          swift build -c release --product fleetmate
          swift build -c release --product FleetMateApp

      - name: Test
        run: swift test

  publish:
    needs: [check, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      REVISION: ${{ needs.check.outputs.revision }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Move the pin, open or update the pull request, and merge it
        run: |
          sed -i -E "s/(agentsmate\.git\", revision: \")[0-9a-f]{40}/\1$REVISION/" Package.swift
          if git diff --quiet -- Package.swift; then echo "Already at $REVISION"; exit 0; fi
          [ "$(git diff --numstat | wc -l)" -eq 1 ] || { echo "::error::Unexpected changes"; exit 1; }
          short=${REVISION:0:7}
          old=$(git show HEAD:Package.swift | grep -oE 'agentsmate\.git", revision: "[0-9a-f]{40}"' | grep -oE '[0-9a-f]{40}')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -am "Follow AgentsMate main to $short"
          git push --force origin "$BRANCH"
          body="Moves the agent terminal's AgentsMate pin to focusedsystems/agentsmate@$REVISION.

          What changed upstream: https://github.com/focusedsystems/agentsmate/compare/$old...$REVISION

          Before this pull request opened, the agentsmate-sync build job built every product and ran the test suite against that revision. It merges once ci.yml passes on it.

          Risk: low. Only the pin changes, and reverting the commit restores the previous revision."
          if [ "$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$BRANCH" --title "Follow AgentsMate main to $short" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "Follow AgentsMate main to $short" --body "$body"
          fi
          gh workflow run ci.yml --ref "$BRANCH"
          gh pr merge "$BRANCH" --auto --squash --delete-branch
