# .github/workflows/ci.yml
#
# Fast build validation on every push to main and every PR. Compiles all
# three SPM products (fleetmate CLI, FleetMateApp, FleetMateCore) in release
# configuration so a broken build is caught before it reaches a tag/release.
#
# No signing, no notarization, no secrets: the FleetMate binaries read their
# credentials at runtime from ~/.config/fleetmate, so nothing sensitive is
# needed to compile. Signing happens downstream in the ECU Azure DevOps
# "Munki - Mgmt Tools Bootstrap" pipeline (munki-bootstrap-mgmt), which pulls
# the GitHub Release produced by release.yml and signs it with the ECU
# Developer ID.

name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # Every pull request runs, docs-only ones included: main requires this
  # check, and a check that never starts would hold the pull request forever.
  pull_request:
  # reportmate-sync starts this run on its branch, because a pull request it
  # opens with GITHUB_TOKEN does not trigger pull_request workflows.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select newest Xcode 26 (provides the macOS 26 SDK + actool Liquid Glass icons)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Build release (all products)
        run: |
          swift build -c release --product fleetmate
          swift build -c release --product FleetMateApp

      # The test target was never built by CI, so a test could not fail here --
      # it was not compiled, let alone run. Tests that nothing executes are
      # worse than no tests: they read as coverage.
      - name: Test
        run: swift test

  # A run started by workflow_dispatch (reportmate-sync does this for its pull
  # request) is not counted toward the pull request's required check, so this
  # job records the result as a commit status under the same name. It runs no
  # code from the repository, so the build above never holds this token.
  report:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Record the result on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = success ]; then state=success; else state=failure; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="Build and test" \
            -f target_url="$RUN_URL" -f description="workflow_dispatch run: $RESULT"
