# Publishes TicketsMate as a GitHub Release: the app, zipped as
# TicketsMate-App-<version>.zip.
#
# The release is unsigned and not notarised, on purpose. No signing material
# lives in this repository. Whoever deploys TicketsMate downloads the release,
# then signs and notarises it with their own identity: the extension at
# Contents/PlugIns/TicketLinks.appex with its own entitlements first, then
# Contents/Library/LoginItems/TicketsMate Inbox Helper.app with the app's
# entitlements and `--identifier <app bundle id>`, then the app. `make sign`
# does the same with an identity you pass in.
#
# Runs when a sync from upstream merges to main, on a vYYYY.MM.DD.HHMM tag, or
# by hand. A push to main tags the release with the time it was built.

name: release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select newest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Resolve version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"
            echo "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}$' || { echo "::error::Tag $REF_NAME is not vYYYY.MM.DD.HHMM"; exit 1; }
          else
            VERSION="$(TZ=UTC date '+%Y.%m.%d.%H%M')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build the unsigned app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make zip VERSION="$VERSION"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicketsMate-${{ steps.version.outputs.version }}
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --generate-notes
          fi
